name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-generate Android settings.gradle
        run: |
          mkdir -p react-native-app/android
          if [ ! -f "react-native-app/android/settings.gradle" ]; then
            echo "Generating clean settings.gradle..."
            cat << 'EOF' > react-native-app/android/settings.gradle
          pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
          plugins { id("com.facebook.react.settings") }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ it.autolinkLibrariesFromCommand() }

          rootProject.name = 'AutoPartsIndia'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF
          else
            echo "settings.gradle already exists. Verifying ':app' and rootProject inclusion..."
            if ! grep -q "include ':app'" react-native-app/android/settings.gradle; then
              echo "include ':app'" >> react-native-app/android/settings.gradle
            fi
            if ! grep -q "rootProject.name" react-native-app/android/settings.gradle; then
              echo "rootProject.name = 'AutoPartsIndia'" >> react-native-app/android/settings.gradle
            fi
          fi

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Auto-generate Clean Binary PNG Icons & Clean Resources
        run: |
          echo "==== Step 1: Running Node Icon Generation Script if available ===="
          if [ -f "generate-app-icons.js" ]; then
            node generate-app-icons.js || true
          fi

          echo "==== Step 2: Installing Image Processing Tools ===="
          sudo apt-get update && sudo apt-get install -y imagemagick

          echo "==== Step 3: Creating Valid 32-bit Binary PNG Icon ===="
          mkdir -p /tmp/clean_icons
          convert -size 512x512 xc:"#1E88E5" -fill white -gravity center -pointsize 120 -draw "text 0,0 'API'" png32:/tmp/clean_icons/base_icon.png

          echo "==== Step 4: Cleaning mipmap-anydpi-v26 conflicts ===="
          for res_dir in "react-native-app/android/app/src/main/res" "android/app/src/main/res"; do
            if [ -d "$res_dir/mipmap-anydpi-v26" ]; then
              echo "Removing conflicting PNGs from $res_dir/mipmap-anydpi-v26..."
              rm -f "$res_dir/mipmap-anydpi-v26/"*.png
            fi
          done

          echo "==== Step 5: Overwriting corrupt launcher and notification icons in pixel-density mipmap folders ===="
          for res_dir in "react-native-app/android/app/src/main/res" "android/app/src/main/res"; do
            if [ -d "$res_dir" ]; then
              for dir in "$res_dir"/mipmap-*; do
                if [ -d "$dir" ] && [ "$dir" != "$res_dir/mipmap-anydpi-v26" ]; then
                  echo "Ensuring binary icons in $dir..."
                  cp /tmp/clean_icons/base_icon.png "$dir/ic_launcher.png"
                  cp /tmp/clean_icons/base_icon.png "$dir/ic_launcher_round.png"
                  cp /tmp/clean_icons/base_icon.png "$dir/ic_launcher_foreground.png"
                  cp /tmp/clean_icons/base_icon.png "$dir/ic_launcher_monochrome.png"
                  cp /tmp/clean_icons/base_icon.png "$dir/ic_notification.png"
                fi
              done
            fi
          done

          echo "==== Step 6: Cleaning conflicting ic_launcher_background.xml files ===="
          for res_dir in "react-native-app/android/app/src/main/res" "android/app/src/main/res"; do
            if [ -d "$res_dir" ]; then
              find "$res_dir" -name "ic_launcher_background.xml" -exec rm -f {} \;
            fi
          done

          echo "==== Step 7: Ensuring valid binary PNGs for drawable assets & ic_notification ===="
          for res_dir in "react-native-app/android/app/src/main/res" "android/app/src/main/res"; do
            if [ -d "$res_dir" ]; then
              find "$res_dir" -type d -name "drawable-*" | while read -r dir; do
                echo "Updating drawable icons in $dir..."
                cp /tmp/clean_icons/base_icon.png "$dir/ic_notification.png"
                if [ -f "$dir/splash_logo.png" ] || [ ! -f "$dir/splash_logo.png" ]; then
                  cp /tmp/clean_icons/base_icon.png "$dir/splash_logo.png"
                fi
                if [ -f "$dir/master_logo.png" ] || [ ! -f "$dir/master_logo.png" ]; then
                  cp /tmp/clean_icons/base_icon.png "$dir/master_logo.png"
                fi
                find "$dir" -type f ! -name "splash_logo.png" ! -name "master_logo.png" ! -name "ic_notification.png" -name "*.png" -exec rm -f {} \;
              done
            fi
          done

      - name: Bundle React Native JS Assets
        run: |
          cd react-native-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Ensure Gradle Wrapper Executable (v8.8)
        run: |
          cd react-native-app/android
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew

      - name: Ensure google-services.json
        run: |
          cd react-native-app/android/app
          if [ ! -f "google-services.json" ]; then
            echo "google-services.json is missing, creating configuration..."
            cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:9d4586f4a8e2b8109d1234",
                  "android_client_info": {
                    "package_name": "com.autopartsindia"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAGYut7q3nCW-qSDPSldGSbxAjnna_-bvo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "google-services.json is already present."
          fi

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing. Auto-generating development signing key..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          else
            echo "debug.keystore is already present."
          fi

      - name: Build React Native Android Debug APK
        run: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Build React Native Android Release APK
        run: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk
