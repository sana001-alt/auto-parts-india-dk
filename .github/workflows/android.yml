name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-generate Android settings.gradle
        run: |
          mkdir -p react-native-app/android
          if [ ! -f "react-native-app/android/settings.gradle" ]; then
            echo "Generating clean settings.gradle..."
            cat << 'EOF' > react-native-app/android/settings.gradle
          pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
          plugins { id("com.facebook.react.settings") }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ it.autolinkLibrariesFromCommand() }

          rootProject.name = 'AutoPartsIndia'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF
          else
            echo "settings.gradle already exists. Verifying ':app' and rootProject inclusion..."
            if ! grep -q "include ':app'" react-native-app/android/settings.gradle; then
              echo "include ':app'" >> react-native-app/android/settings.gradle
            fi
            if ! grep -q "rootProject.name" react-native-app/android/settings.gradle; then
              echo "rootProject.name = 'AutoPartsIndia'" >> react-native-app/android/settings.gradle
            fi
          fi

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Auto-generate Clean Binary PNG Icons & Clean Resources
        run: |
          echo "==== Step 1: Running Zero-Dependency Pure Node PNG Generator ===="
          node generate-pure-icons.js

          echo "==== Step 2: Verifying App-Owned PNG Binary Integrity ===="
          node -e "
          const fs = require('fs');
          const path = require('path');
          const pngSig = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
          let checked = 0;

          const appOwnedPngs = new Set([
            'ic_launcher.png',
            'ic_launcher_round.png',
            'ic_launcher_foreground.png',
            'ic_launcher_monochrome.png',
            'ic_notification.png',
            'splash_logo.png',
            'master_logo.png'
          ]);

          function scanDir(dir) {
            if (!fs.existsSync(dir)) return;
            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) {
                scanDir(full);
              } else if (item.endsWith('.png') && appOwnedPngs.has(item)) {
                const buf = fs.readFileSync(full);
                if (buf.length < 8 || !buf.subarray(0, 8).equals(pngSig)) {
                  console.error('Invalid PNG detected at:', full);
                  process.exit(1);
                }
                checked++;
              }
            }
          }

          scanDir('react-native-app/android/app/src/main/res');
          scanDir('android/app/src/main/res');
          console.log('✅ Successfully verified ' + checked + ' app-owned binary PNG assets across all density folders.');
          "

      - name: Bundle React Native JS Assets
        run: |
          cd react-native-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Ensure Gradle Wrapper Executable (v8.8)
        run: |
          cd react-native-app/android
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew

      - name: Ensure google-services.json
        run: |
          cd react-native-app/android/app
          if [ ! -f "google-services.json" ]; then
            echo "google-services.json is missing, creating configuration..."
            cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:6b6de5952abc431da6dc01",
                  "android_client_info": {
                    "package_name": "com.autopartsindia"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAGYut7q3nCW-qSDPSldGSbxAjnna_-bvo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "google-services.json is already present."
          fi

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing. Auto-generating development signing key..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          else
            echo "debug.keystore is already present."
          fi

      - name: Build React Native Android Debug APK
        run: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Build React Native Android Release APK
        run: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk
