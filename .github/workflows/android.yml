name: Build React Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-generate Android settings.gradle
        run: |
          mkdir -p react-native-app/android
          if [ ! -f "react-native-app/android/settings.gradle" ]; then
            echo "Generating clean settings.gradle..."
            cat << 'EOF' > react-native-app/android/settings.gradle
          pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
          plugins { id("com.facebook.react.settings") }
          extensions.configure(com.facebook.react.ReactSettingsExtension){ it.autolinkLibrariesFromCommand() }

          rootProject.name = 'AutoPartsIndia'
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF
          else
            echo "settings.gradle already exists. Verifying ':app' and rootProject inclusion..."
            if ! grep -q "include ':app'" react-native-app/android/settings.gradle; then
              echo "include ':app'" >> react-native-app/android/settings.gradle
            fi
            if ! grep -q "rootProject.name" react-native-app/android/settings.gradle; then
              echo "rootProject.name = 'AutoPartsIndia'" >> react-native-app/android/settings.gradle
            fi
          fi

      - name: Install React Native Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Clean Conflicting & Duplicate Resources
        run: |
          echo "==== Step 1: Cleaning conflicting ic_launcher_background.xml files ===="
          # Clean all ic_launcher_background.xml files so color is solely defined in values/colors.xml
          find react-native-app/android/app/src/main/res -name "ic_launcher_background.xml" -exec rm -f {} \;
          
          echo "==== Step 2: Preventing duplicate asset resources ===="
          # npx react-native bundle often dumps asset files in android/app/src/main/res/drawable-* folders.
          # When Gradle is run, the React Native Gradle plugin copies these assets again or compiles them, triggering duplicate resource crashes.
          # We delete any existing auto-generated drawable-* asset folders before Gradle compilation to allow a clean, single-source compilation.
          # We preserve important manual resources like splash logos while removing standard bundled files.
          find react-native-app/android/app/src/main/res -type d -name "drawable-*" | while read -r dir; do
            echo "Cleaning up generated assets in $dir to prevent AAPT duplicates"
            # Remove any standard asset pngs that are copied by the packager but keep custom launcher assets if they exist
            find "$dir" -type f ! -name "splash_logo.png" ! -name "master_logo.png" ! -name "ic_notification.png" -name "*.png" -exec rm -f {} \;
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          validate-wrappers: false

      - name: Ensure Gradle Wrapper Executable (v8.8)
        run: |
          cd react-native-app/android
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew

      - name: Ensure google-services.json
        run: |
          cd react-native-app/android/app
          if [ ! -f "google-services.json" ]; then
            echo "google-services.json is missing, creating configuration..."
            cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:9d4586f4a8e2b8109d1234",
                  "android_client_info": {
                    "package_name": "com.autopartsindia"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAGYut7q3nCW-qSDPSldGSbxAjnna_-bvo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "google-services.json is already present."
          fi

      - name: Ensure Debug Keystore
        run: |
          cd react-native-app/android/app
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore is missing. Auto-generating development signing key..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          else
            echo "debug.keystore is already present."
          fi

      - name: Build React Native Android Debug APK
        run: |
          cd react-native-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Build React Native Android Release APK
        run: |
          cd react-native-app/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native-app/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-release-apk
          path: react-native-app/android/app/build/outputs/apk/release/*.apk
